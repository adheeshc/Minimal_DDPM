data:
  data_root: ../../../Datasets
  dataset: cifar10
  num_workers: 4
  pin_memory: true
device:
  accelerator: cuda
  mixed_precision: false
diffusion:
  beta_end: 0.02
  beta_start: 0.0001
  offset: 0.008
  schedule_type: linear
  timesteps: 1000
logging:
  exp_name: ddpm_cifar10
  log_every: 100
  num_samples: 64
  output_dir: ./outputs
  sample_every: 2
  save_every: 5
  use_tensorboard: false
model:
  attention_resolutions:
  - 16
  base_channels: 64
  channel_multipliers:
  - 1
  - 2
  - 4
  dropout: 0.0
  image_size: 32
  in_channels: 3
  num_res_blocks: 2
  out_channels: 3
  time_embed_dim: 128
  use_attention: true
optimizer:
  betas:
  - 0.9
  - 0.999
  eps: 1.0e-08
  type: adam
sampling:
  eta: 0.0
  num_inference_steps: 1000
  variance_type: posterior
scheduler:
  type: constant
  warmup_steps: 0
training:
  batch_size: 128
  ema_decay: 0.9999
  grad_clip: 1.0
  learning_rate: 0.0002
  num_epochs: 10
  use_ema: false
  weight_decay: 0.0
